name: Ingest Omaha Accela Code Enforcement

# Trigger Configuration:
# - Scheduled daily execution at 6:00 AM America/Chicago (11:00 UTC during CDT / 12:00 UTC during CST).
#   Temporarily kept commented out awaiting final Stage 16h approval.
# - Manual trigger (workflow_dispatch) with default dry-run (0 writes).
#
# To activate schedule after sign-off:
# on:
#   schedule:
#     - cron: '0 11 * * *'
#   workflow_dispatch:
#     ...

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Ingestion Mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      dry_run:
        description: 'Dry Run mode (0 DB writes). Default is true.'
        required: true
        default: true
        type: boolean
      target_env:
        description: 'Target Environment (Safeguard: DEV only)'
        required: true
        default: 'DEV'
        type: choice
        options:
          - DEV
      confirm_live:
        description: 'To execute live writes manually, set dry_run=false and enter CONFIRM_DEV_LIVE'
        required: false
        default: ''
        type: string

# Restrict workflow to minimum required access (read-only repository contents)
permissions:
  contents: read

# Concurrency protection: prevent overlapping ingestion runs across dispatches
concurrency:
  group: ingestion-omaha-accela
  cancel-in-progress: false

jobs:
  ingest:
    name: Run Accela Collector
    runs-on: ubuntu-latest
    # Dedicated GitHub DEV environment for database secrets and environment protection rules
    environment: DEV
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify Live Execution Safeguards
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "✔ Scheduled execution trigger detected."
            if [ "${{ vars.SCHEDULED_INGESTION_AUTHORIZED }}" != "AUTHORIZED_DEV_SCHEDULE" ]; then
              echo "❌ ERROR: Scheduled ingestion is not authorized."
              echo "Please set DEV environment variable SCHEDULED_INGESTION_AUTHORIZED='AUTHORIZED_DEV_SCHEDULE' in GitHub Settings."
              exit 1
            fi
            echo "✔ Scheduled execution authorization verified."
          else
            if [ "${{ inputs.dry_run }}" = "false" ]; then
              if [ "${{ inputs.target_env }}" != "DEV" ]; then
                echo "❌ ERROR: Live execution is strictly restricted to DEV environment."
                exit 1
              fi
              if [ "${{ inputs.confirm_live }}" != "CONFIRM_DEV_LIVE" ]; then
                echo "❌ ERROR: Live execution requires explicit confirmation. Please set confirm_live to CONFIRM_DEV_LIVE."
                exit 1
              fi
              echo "✔ Live DEV manual execution safeguards verified."
            else
              echo "✔ Dry-run mode confirmed (0 writes)."
            fi
          fi

      - name: Verify Neon DEV Database Endpoint (Preflight Fail-Closed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEON_DEV_ENDPOINT_ID: 'ep-restless-bonus-b4xv9ig1'
        run: npx tsx scripts/verify-neon-dev-preflight.ts

      - name: Run Accela Collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEON_DEV_ENDPOINT_ID: 'ep-restless-bonus-b4xv9ig1'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Executing Scheduled Accela Collector in LIVE DEV mode (incremental)..."
            npx tsx scripts/run-accela-collector.ts --mode incremental --execute-live --confirm-live=CONFIRM_DEV_LIVE
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Executing Accela Collector in DRY-RUN mode (0 writes)..."
            npx tsx scripts/run-accela-collector.ts --mode ${{ inputs.mode }} --dry-run
          else
            echo "Executing Accela Collector in LIVE DEV mode..."
            npx tsx scripts/run-accela-collector.ts --mode ${{ inputs.mode }} --execute-live --confirm-live="${{ inputs.confirm_live }}"
          fi

      - name: Check Ingestion Health & Freshness
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEON_DEV_ENDPOINT_ID: 'ep-restless-bonus-b4xv9ig1'
        run: npx tsx scripts/check-ingestion-health.ts

      - name: Report Scheduled Run Failure
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "::error title=Scheduled Accela Ingestion Failed::The daily Accela code enforcement collection job failed on Neon DEV."
          echo "### ❌ Scheduled Accela Collection Failed" >> $GITHUB_STEP_SUMMARY
          echo "The automated daily Accela code enforcement ingestion encountered an error at $(date -u)." >> $GITHUB_STEP_SUMMARY
          echo "Check the step logs above for details and verify Neon DEV branch health." >> $GITHUB_STEP_SUMMARY
